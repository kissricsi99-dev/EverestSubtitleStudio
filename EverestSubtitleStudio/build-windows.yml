name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python for the build only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller imageio-ffmpeg

      - name: Prepare FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ffmpeg .\ffmpeg.exe

      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VideoAudioExtractor --add-binary "ffmpeg.exe;." video_audio_extractor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoAudioExtractor-Windows10
          path: dist/VideoAudioExtractor.exe
          if-no-files-found: error
